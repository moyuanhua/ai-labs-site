<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- favicon: event horizon + photon ring + central highlight.
       Intentionally not a copy of the HeroOrb canvas: this is the
       *iconized* mark — readable from 16px up. Three pieces only:
       a dark disc, a single teal arc, and a small central glow. -->
  <rect width="128" height="128" rx="22" fill="#f4f1ea"/>
  <circle cx="64" cy="64" r="36" fill="#1c1b18"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="180 360" stroke-dashoffset="-90" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="6" fill="#0d9488" opacity="0.45"/>
</svg>
